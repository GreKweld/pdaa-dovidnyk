<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2ed;
  --surface: #fdfcfa;
  --ink: #1a1814;
  --ink2: #4a4640;
  --ink3: #8a8480;
  --accent: #2d5016;
  --accent2: #8b3a0f;
  --gold: #b8922a;
  --border: #d8d4ce;
  --border2: #ece9e3;
  --card: #ffffff;
  --tag-bg: #eef3e8;
  --tag-c: #2d5016;
  --radius: 6px;
  --shadow: 0 1px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
}

*{box-sizing:border-box;margin:0;padding:0}

body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── HEADER ── */
header {
  background: var(--accent);
  color: #fff;
  padding: 2rem 1.5rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 3px solid var(--gold);
}
.header-top {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  max-width: 900px;
  margin: 0 auto 1rem;
}
.logo-block {
  flex-shrink: 0;
}
.logo-emblem {
  width: 48px;
  height: 48px;
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: var(--gold);
}
.header-titles {
  flex: 1;
}
.header-titles h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(16px, 4vw, 22px);
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.2;
}
.header-titles p {
  font-size: 12px;
  opacity: 0.7;
  font-weight: 300;
  margin-top: 3px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.search-bar {
  max-width: 900px;
  margin: 0 auto;
  position: relative;
}
.search-bar input {
  width: 100%;
  padding: 10px 16px 10px 42px;
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.12);
  color: #fff;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 15px;
  outline: none;
  transition: background .2s, border-color .2s;
}
.search-bar input::placeholder { color: rgba(255,255,255,0.5); }
.search-bar input:focus { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.6;
  font-size: 16px;
  pointer-events: none;
}
.result-count {
  max-width: 900px;
  margin: 6px auto 0;
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  font-family: 'IBM Plex Mono', monospace;
}

/* ── TABS ── */
.tabs-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 90;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs-wrap::-webkit-scrollbar { display: none; }
.tabs {
  display: flex;
  max-width: 900px;
  margin: 0 auto;
  gap: 0;
}
.tab {
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: color .2s, border-color .2s;
  letter-spacing: 0.02em;
  flex-shrink: 0;
}
.tab:hover { color: var(--accent); }
.tab.active { color: var(--accent); border-bottom-color: var(--gold); }

/* ── MAIN ── */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 1.5rem 1rem 4rem;
}

/* ── SECTION TITLE ── */
.section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2rem 0 1rem;
  animation: fadeUp .4s ease both;
}
.section-head:first-child { margin-top: 0; }
.section-label {
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  font-weight: 400;
  color: var(--ink3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}
.section-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.section-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  flex-shrink: 0;
}

/* ── DEPT HEADER ── */
.dept-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: .75rem 1rem;
  margin-bottom: .5rem;
  animation: fadeUp .35s ease both;
}
.dept-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
}
.dept-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 5px;
}
.dept-phone, .dept-email {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--ink3);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ── CONTACT CARD ── */
.contact-card {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: .7rem 1rem;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  animation: fadeUp .3s ease both;
}
.contact-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow);
  border-color: var(--border);
}
.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  flex-shrink: 0;
  font-family: 'IBM Plex Mono', monospace;
}
.contact-info { flex: 1; min-width: 0; }
.contact-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.contact-role {
  font-size: 12px;
  color: var(--ink3);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.contact-phones {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  flex-shrink: 0;
}
.phone-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--accent);
  background: var(--tag-bg);
  padding: 2px 8px;
  border-radius: 99px;
  white-space: nowrap;
}
.phone-tag a {
  color: inherit;
  text-decoration: none;
}
.phone-tag.inner {
  color: var(--accent2);
  background: #f9ede8;
}
.phone-tag.email-tag {
  color: var(--ink3);
  background: var(--border2);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── DEPT ONLY CARD (no person) ── */
.dept-only {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: .7rem 1rem;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: fadeUp .3s ease both;
  transition: border-color .15s;
}
.dept-only:hover { border-color: var(--border); }
.dept-only-name {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}

/* ── EMPTY ── */
.empty {
  text-align: center;
  padding: 4rem 1rem;
  color: var(--ink3);
}
.empty-glyph {
  font-size: 40px;
  margin-bottom: 1rem;
  opacity: .4;
}
.empty p { font-size: 15px; }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── FOOTER ── */
footer {
  text-align: center;
  padding: 2rem 1rem;
  color: var(--ink3);
  font-size: 12px;
  border-top: 1px solid var(--border);
  margin-top: 2rem;
}
footer strong { color: var(--accent); }

/* ── RESPONSIVE ── */
@media(max-width: 540px) {
  .contact-card { flex-wrap: wrap; }
  .contact-phones { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .phone-tag.email-tag { display: none; }
}
</style>

/* ══════════════════════════════════════════════════════════
   AVATAR COLORS
══════════════════════════════════════════════════════════ */
const palettes = [
  {bg:'#eef3e8',c:'#2d5016'},{bg:'#e8f0ee',c:'#1a4a38'},{bg:'#f3eee8',c:'#5a3210'},
  {bg:'#eee8f0',c:'#3a1a5a'},{bg:'#e8eef3',c:'#10385a'},{bg:'#f0f3e8',c:'#3a5a10'},
  {bg:'#f3e8ee',c:'#5a1038'},{bg:'#e8f3f0',c:'#105a4a'},
];
function palette(name){return palettes[name.charCodeAt(0)%palettes.length]}
function initials(name){
  const p=name.trim().split(' ');
  return(p[0]?p[0][0]:'')+(p[1]?p[1][0]:'');
}

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let activeTab = DATA[0].id;
let query = '';

/* ══════════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════════ */
function buildTabs(){
  const row=document.getElementById('tabsRow');
  row.innerHTML=DATA.map(g=>`
    <div class="tab${g.id===activeTab?' active':''}" onclick="setTab('${g.id}')">${g.tab}</div>
  `).join('');
}

function setTab(id){
  activeTab=id;
  query='';
  document.getElementById('searchInput').value='';
  buildTabs();
  render();
}

function doSearch(){
  query=document.getElementById('searchInput').value.toLowerCase().trim();
  buildTabs();
  renderAll();
}

function phoneTag(p, inner){
  if(!p) return '';
  const cls = inner ? 'phone-tag inner' : 'phone-tag';
  const prefix = inner ? 'вн.' : '';
  return `<span class="${cls}">${prefix}${p}</span>`;
}

function emailTag(e){
  if(!e)return'';
  const short = e.length>22 ? e.slice(0,22)+'…' : e;
  return `<span class="phone-tag email-tag" title="${e}">${short}</span>`;
}

function renderPerson(p, delay){
  const col=palette(p.name);
  const ini=initials(p.name);
  const phones=[phoneTag(p.city,false), phoneTag(p.inner,true), emailTag(p.email)].filter(Boolean).join('');
  return `
    <div class="contact-card" style="animation-delay:${delay}s">
      <div class="avatar" style="background:${col.bg};color:${col.c}">${ini.toUpperCase()}</div>
      <div class="contact-info">
        <div class="contact-name">${p.name}</div>
        <div class="contact-role">${p.role}</div>
      </div>
      <div class="contact-phones">${phones||''}</div>
    </div>`;
}

function renderSection(sec, baseDelay){
  let html=`<div class="dept-header" style="animation-delay:${baseDelay}s">
    <h3>${sec.title}</h3>`;
  const meta=[];
  if(sec.deptPhone||sec.deptInner){
    const ph=[sec.deptPhone?`📞 ${sec.deptPhone}`:'', sec.deptInner?`вн. ${sec.deptInner}`:''].filter(Boolean).join(' · ');
    meta.push(`<span class="dept-phone">${ph}</span>`);
  }
  if(sec.deptEmail) meta.push(`<span class="dept-email">✉ ${sec.deptEmail}</span>`);
  if(meta.length) html+=`<div class="dept-meta">${meta.join('')}</div>`;
  html+='</div>';
  (sec.people||[]).forEach((p,i)=>{ html+=renderPerson(p, baseDelay+0.02+i*0.025); });
  return html;
}

function render(){
  const group=DATA.find(g=>g.id===activeTab);
  if(!group){mainContent.innerHTML='';return;}
  let html='';
  let delay=0;
  group.sections.forEach(sec=>{
    html+=renderSection(sec, delay);
    delay+=0.05;
  });
  document.getElementById('mainContent').innerHTML=html;
  const total=group.sections.reduce((a,s)=>a+(s.people||[]).length,0);
  document.getElementById('resCount').textContent=`${total} осіб`;
}

function renderAll(){
  // Search mode — show across all tabs
  const q=query;
  if(!q){render();buildTabs();return;}

  let html='';
  let total=0;
  let delay=0;

  DATA.forEach(group=>{
    let groupHtml='';
    group.sections.forEach(sec=>{
      const matches=(sec.people||[]).filter(p=>
        p.name.toLowerCase().includes(q)||
        p.role.toLowerCase().includes(q)||
        (p.city||'').includes(q)||
        (p.inner||'').includes(q)||
        (p.email||'').toLowerCase().includes(q)||
        sec.title.toLowerCase().includes(q)
      );
      if(!matches.length) return;
      groupHtml+=`<div class="dept-header" style="animation-delay:${delay}s">
        <h3>${sec.title}</h3>`;
      if(sec.deptPhone||sec.deptInner){
        const ph=[sec.deptPhone?`📞 ${sec.deptPhone}`:'', sec.deptInner?`вн. ${sec.deptInner}`:''].filter(Boolean).join(' · ');
        groupHtml+=`<div class="dept-meta"><span class="dept-phone">${ph}</span>`;
        if(sec.deptEmail) groupHtml+=`<span class="dept-email">✉ ${sec.deptEmail}</span>`;
        groupHtml+=`</div>`;
      }
      groupHtml+='</div>';
      matches.forEach((p,i)=>{ groupHtml+=renderPerson(p, delay+0.02+i*0.02); total++; });
      delay+=0.04;
    });
    if(groupHtml){
      html+=`<div class="section-head" style="animation-delay:${delay}s">
        <span class="section-dot"></span>
        <span class="section-label">${group.tab}</span>
        <span class="section-line"></span>
      </div>${groupHtml}`;
    }
  });

  if(!html) html=`<div class="empty">
    <div class="empty-glyph">⌕</div>
    <p>За запитом «${query}» нічого не знайдено</p>
  </div>`;

  document.getElementById('mainContent').innerHTML=html;
  document.getElementById('resCount').textContent=total?`${total} результатів`:'';
}

// Init
buildTabs();
render();
</script>
